<?xml version="1.0" encoding="UTF-8"?>
<!--
  BP-010 planning drawing. Source of truth: src/bench-prototype-contract.ts,
  planningDrawing. This is a dimensioned zoning aid only, not a fabrication
  outline, placement release, enclosure drawing, or authorization to order.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description" data-contract="benchPrototypeContract.planningDrawing" data-artifact-status="provisional zoning coordinates; not a fabrication outline" data-datum="lower-left planning datum" data-units="mm" data-release-state="deny">
  <title id="title">BP-010 provisional one-board bench prototype zoning drawing</title>
  <desc id="description">A 300 by 160 millimetre planning envelope, divided into fixture, analog, scoring, isolation, application, USB-C and Ethernet, and display zones. All dimensions are planning coordinates from the executable BP-010 contract.</desc>
  <defs>
    <pattern id="isolation-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7c2d12" stroke-width="3"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .note { font-size: 14px; fill: #475569; }
      .zone { stroke: #172033; stroke-width: 2; }
      .zone-label { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .zone-detail { font-size: 12px; text-anchor: middle; }
      .dimension { stroke: #334155; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .extension { stroke: #64748b; stroke-width: 1; stroke-dasharray: 4 3; }
      .dimension-label { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #334155; }
      .connector { fill: #0f766e; stroke: #ffffff; stroke-width: 2; }
      .connector-label { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .connector-line { stroke: #0f766e; stroke-width: 1.5; }
      .datum { stroke: #be123c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="60" y="48" class="title">BP-010 one-board bench prototype: provisional zone drawing</text>
  <text x="60" y="72" class="note">Planning datum: lower-left. All coordinates and dimensions are mm from <tspan font-family="monospace">benchPrototypeContract.planningDrawing</tspan>.</text>
  <text x="60" y="94" class="note">Status: prototype-only / DENY — zoning reservation only; no fabrication outline, layout, enclosure, or ordering authority.</text>

  <!-- Envelope: SVG point (160,660) equals contract planning coordinate (0,0); scale is 3 SVG units/mm. -->
  <g id="planning-envelope" data-width-mm="300" data-height-mm="160" data-origin="lower-left">
    <rect x="160" y="180" width="900" height="480" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  </g>

  <g id="zone-fixture-entry" data-zone-id="fixture-entry" data-x-min="0" data-x-max="35" data-y-min="0" data-y-max="160">
    <rect class="zone" x="160" y="180" width="105" height="480" fill="#e2e8f0"/>
    <text x="212.5" y="525" class="zone-label">Fixture entry</text>
    <text x="212.5" y="546" class="zone-detail">shared access</text>
    <text x="212.5" y="564" class="zone-detail">0–35 × 0–160</text>
  </g>
  <g id="zone-analog-acquisition" data-zone-id="analog-acquisition" data-x-min="35" data-x-max="90" data-y-min="0" data-y-max="160">
    <rect class="zone" x="265" y="180" width="165" height="480" fill="#dbeafe"/>
    <text x="347.5" y="514" class="zone-label">Analog acquisition</text>
    <text x="347.5" y="536" class="zone-detail">SCORING_SGND</text>
    <text x="347.5" y="554" class="zone-detail">35–90 × 0–160</text>
  </g>
  <g id="zone-scoring-control" data-zone-id="scoring-control" data-x-min="90" data-x-max="145" data-y-min="0" data-y-max="160">
    <rect class="zone" x="430" y="180" width="165" height="480" fill="#bfdbfe"/>
    <text x="512.5" y="365" class="zone-label">Scoring control</text>
    <text x="512.5" y="387" class="zone-detail">STM32 / SCORING_SGND</text>
    <text x="512.5" y="405" class="zone-detail">90–145 × 0–160</text>
  </g>
  <g id="zone-isolation-corridor" data-zone-id="isolation-corridor" data-x-min="145" data-x-max="165" data-y-min="0" data-y-max="160">
    <rect class="zone" x="595" y="180" width="60" height="480" fill="#fed7aa"/>
    <rect x="595" y="180" width="60" height="480" fill="url(#isolation-hatch)"/>
    <text x="625" y="364" class="zone-label" transform="rotate(-90 625 364)">Isolation corridor</text>
    <text x="642" y="426" class="zone-detail" transform="rotate(-90 642 426)">145–165 × 0–160</text>
  </g>
  <g id="zone-application-control" data-zone-id="application-control" data-x-min="165" data-x-max="215" data-y-min="0" data-y-max="160">
    <rect class="zone" x="655" y="180" width="150" height="480" fill="#dcfce7"/>
    <text x="730" y="365" class="zone-label">Application control</text>
    <text x="730" y="387" class="zone-detail">ESP32 / APP_GND</text>
    <text x="730" y="405" class="zone-detail">165–215 × 0–160</text>
  </g>
  <g id="zone-power-ethernet-edge" data-zone-id="power-ethernet-edge" data-x-min="215" data-x-max="300" data-y-min="60" data-y-max="160">
    <rect class="zone" x="805" y="180" width="255" height="300" fill="#d1fae5"/>
    <text x="932.5" y="320" class="zone-label">USB-C power + Ethernet edge</text>
    <text x="932.5" y="342" class="zone-detail">APP_GND with PD, W5500, and MagJack</text>
    <text x="932.5" y="360" class="zone-detail">215–300 × 60–160</text>
  </g>
  <g id="zone-display-edge" data-zone-id="display-edge" data-x-min="215" data-x-max="300" data-y-min="0" data-y-max="60">
    <rect class="zone" x="805" y="480" width="255" height="180" fill="#bbf7d0"/>
    <text x="870" y="545" class="zone-label">Display edge</text>
    <text x="870" y="567" class="zone-detail">APP_GND with HUB75</text>
    <text x="870" y="585" class="zone-detail">215–300 × 0–60</text>
  </g>

  <!-- Overall and partition dimensions. -->
  <g aria-label="planning dimensions">
    <line class="extension" x1="160" y1="660" x2="160" y2="720"/><line class="extension" x1="1060" y1="660" x2="1060" y2="720"/>
    <line class="dimension" x1="160" y1="710" x2="1060" y2="710" data-dimension="300 mm"/>
    <text x="610" y="704" class="dimension-label">300 mm planning envelope</text>
    <line class="extension" x1="160" y1="180" x2="110" y2="180"/><line class="extension" x1="160" y1="660" x2="110" y2="660"/>
    <line class="dimension" x1="120" y1="180" x2="120" y2="660" data-dimension="160 mm"/>
    <text x="104" y="430" class="dimension-label" transform="rotate(-90 104 430)">160 mm planning envelope</text>

    <line class="extension" x1="160" y1="660" x2="160" y2="750"/><line class="extension" x1="265" y1="660" x2="265" y2="750"/>
    <line class="extension" x1="430" y1="660" x2="430" y2="750"/><line class="extension" x1="595" y1="660" x2="595" y2="750"/>
    <line class="extension" x1="655" y1="660" x2="655" y2="750"/><line class="extension" x1="805" y1="660" x2="805" y2="750"/>
    <line class="extension" x1="1060" y1="660" x2="1060" y2="750"/>
    <line class="dimension" x1="160" y1="740" x2="265" y2="740" data-dimension="0-35 mm"/><text x="212.5" y="735" class="dimension-label">35</text>
    <line class="dimension" x1="265" y1="740" x2="430" y2="740" data-dimension="35-90 mm"/><text x="347.5" y="735" class="dimension-label">55</text>
    <line class="dimension" x1="430" y1="740" x2="595" y2="740" data-dimension="90-145 mm"/><text x="512.5" y="735" class="dimension-label">55</text>
    <line class="dimension" x1="595" y1="740" x2="655" y2="740" data-dimension="145-165 mm"/><text x="625" y="735" class="dimension-label">20 isolation</text>
    <line class="dimension" x1="655" y1="740" x2="805" y2="740" data-dimension="165-215 mm"/><text x="730" y="735" class="dimension-label">50</text>
    <line class="dimension" x1="805" y1="740" x2="1060" y2="740" data-dimension="215-300 mm"/><text x="932.5" y="735" class="dimension-label">85</text>
    <line class="extension" x1="1060" y1="480" x2="1100" y2="480"/><line class="extension" x1="1060" y1="660" x2="1100" y2="660"/>
    <line class="dimension" x1="1090" y1="480" x2="1090" y2="660" data-dimension="0-60 mm"/><text x="1105" y="575" class="dimension-label" transform="rotate(-90 1105 575)">60</text>
    <line class="extension" x1="1060" y1="180" x2="1130" y2="180"/><line class="extension" x1="1060" y1="480" x2="1130" y2="480"/>
    <line class="dimension" x1="1120" y1="180" x2="1120" y2="480" data-dimension="60-160 mm"/><text x="1135" y="345" class="dimension-label" transform="rotate(-90 1135 345)">100</text>
  </g>

  <!-- Connector coordinates are contract planning coordinates, not component footprints. -->
  <g id="connector-coordinates" aria-label="connector planning coordinates">
    <g data-connector-id="J_WEAPON_FIXTURE" data-edge="left" data-x="0" data-y="80"><circle class="connector" cx="160" cy="420" r="7"/><line class="connector-line" x1="160" y1="420" x2="175" y2="420"/><text class="connector-label" x="180" y="415">J_WEAPON_FIXTURE</text><text class="note" x="180" y="431">(0, 80) left</text></g>
    <g data-connector-id="J_PRIMARY_OUTPUTS" data-edge="left" data-x="0" data-y="130"><circle class="connector" cx="160" cy="270" r="7"/><line class="connector-line" x1="160" y1="270" x2="175" y2="270"/><text class="connector-label" x="180" y="265">J_PRIMARY_OUTPUTS</text><text class="note" x="180" y="281">(0, 130) left</text></g>
    <g data-connector-id="J_STM_SWD" data-edge="top" data-x="118" data-y="160"><circle class="connector" cx="514" cy="180" r="7"/><line class="connector-line" x1="514" y1="180" x2="514" y2="132"/><text class="connector-label" x="514" y="122" text-anchor="middle">J_STM_SWD (118, 160) top</text></g>
    <g data-connector-id="J_ESP_SERVICE" data-edge="top" data-x="192" data-y="160"><circle class="connector" cx="736" cy="180" r="7"/><line class="connector-line" x1="736" y1="180" x2="736" y2="148"/><text class="connector-label" x="736" y="138" text-anchor="middle">J_ESP_SERVICE (192, 160) top</text></g>
    <g data-connector-id="J_LAB_INJECTION" data-edge="top" data-x="235" data-y="160"><circle class="connector" cx="865" cy="180" r="7"/><line class="connector-line" x1="865" y1="180" x2="865" y2="132"/><text class="connector-label" x="865" y="122" text-anchor="middle">J_LAB_INJECTION (235, 160) top</text></g>
    <g data-connector-id="J_USB_C" data-edge="right" data-x="300" data-y="90"><circle class="connector" cx="1060" cy="390" r="7"/><line class="connector-line" x1="1060" y1="390" x2="1048" y2="390"/><text class="connector-label" x="1044" y="385" text-anchor="end">J_USB_C</text><text class="note" x="1044" y="401" text-anchor="end">(300, 90) right</text></g>
    <g data-connector-id="J_ETHERNET_MAGJACK" data-edge="right" data-x="300" data-y="130"><circle class="connector" cx="1060" cy="270" r="7"/><line class="connector-line" x1="1060" y1="270" x2="1048" y2="270"/><text class="connector-label" x="1044" y="265" text-anchor="end">J_ETHERNET_MAGJACK</text><text class="note" x="1044" y="281" text-anchor="end">(300, 130) right</text></g>
    <g data-connector-id="J_HUB75" data-edge="right" data-x="300" data-y="30"><circle class="connector" cx="1060" cy="570" r="7"/><line class="connector-line" x1="1060" y1="570" x2="1048" y2="570"/><text class="connector-label" x="1044" y="565" text-anchor="end">J_HUB75</text><text class="note" x="1044" y="581" text-anchor="end">(300, 30) right</text></g>
  </g>

  <g aria-label="datum marker">
    <line class="datum" x1="160" y1="660" x2="215" y2="660"/><line class="datum" x1="160" y1="660" x2="160" y2="605"/>
    <text x="220" y="676" class="note">(0,0) lower-left planning datum</text>
    <text x="1060" y="680" class="note" text-anchor="end">Contract coordinates only — no copper, plane, mounting, clearance, or fabrication credit.</text>
  </g>
</svg>
