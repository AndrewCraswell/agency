<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fencing Club template preview</title>
    <script>
      // Runs before first paint so the chrome never flashes the wrong theme.
      ;(function () {
        var stored = localStorage.getItem("fcPreviewTheme")
        var preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = stored || preferred
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
