packages:
  - "apps/legislation"
  - "apps/legislation-web"
  - "packages/oxlint-config"
  - "packages/typescript-config"

# Keep the dependency graph locked while isolating Railway from unrelated
# workspace packages and the workstation's hoisted node_modules layout.
nodeLinker: isolated
packageExtensions:
  "circuit-json@0.0.465":
    dependencies:
      zod: 3.25.76
catalog:
  "@types/node": 24.13.2
  typescript: 7.0.1-rc
overrides:
  react: 19.2.7
  react-dom: 19.2.7
allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  protobufjs: true
  prisma: true
  unrs-resolver: true
  sharp: true
  "@depot/cli": true
