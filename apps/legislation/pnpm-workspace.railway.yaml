packages:
  - "apps/legislation"
  - "packages/oxlint-config"
  - "packages/typescript-config"

# Keep the install model and lockfile-affecting configuration identical to the
# repository while excluding unrelated workspace roots.
nodeLinker: isolated
packageExtensions:
  "@tscircuit/props@0.0.618":
    dependencies:
      zod: 3.25.76
  "circuit-json@0.0.465":
    dependencies:
      zod: 3.25.76
catalog:
  "@types/node": 24.13.2
  typescript: 7.0.1-rc
overrides:
  ai@7.0.94: file:apps/legislation/vendor/ai-7.0.94.tgz
  react: 19.2.7
  react-dom: 19.2.7
allowBuilds:
  "@sentry/cli": false
  esbuild: true
  lefthook: true
  msw: true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  protobufjs: true
  prisma: true
  unrs-resolver: true
  sharp: true
  "@depot/cli": true
