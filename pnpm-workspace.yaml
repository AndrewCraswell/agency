packages:
  - "apps/*"
  - "packages/*"
# Flat node_modules so depending on @repo/storybook-config transitively provides
# the whole Storybook stack (addons resolve from the app dir).
nodeLinker: hoisted
# Versions locked once for the whole monorepo. Reference them with "catalog:".
catalog:
  "@types/node": 24.13.2
  typescript: 7.0.1-rc
# React and React DOM must resolve to one exact, identical version: react-dom throws on a
# mismatch, and the registry mirror tags canaries as "latest", so a bare install drifts.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  protobufjs: true
  prisma: true
  unrs-resolver: true
  sharp: true
minimumReleaseAgeExclude:
  - vite@8.1.3
  - chromatic@18.0.1
peerDependencyRules:
  allowedVersions:
    "@1js/fluentui-message-bar-manager@2>react": "19"
    "@1js/fluentui-message-bar-manager@2>react-dom": "19"
    "@1js/fluentui-modal-manager@2>react": "19"
    "@1js/fluentui-modal-manager@2>react-dom": "19"
    "@1js/fluentui-rhf-inputs@1>@fluentui/react-datepicker-compat": "0.6"
    "@1js/fluentui-rhf-inputs@1>@fluentui/react-timepicker-compat": "0.4"
    "@1js/fluentui-rhf-inputs@1>react": "19"
    "@1js/fluentui-rhf-inputs@1>react-dom": "19"
