name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The committed .npmrc supports development behind the work VPN. CI uses
  # pnpm's higher-precedence override and does not need Azure credentials.
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  # Keep interaction-heavy browser tests deterministic on hosted runners.
  VITEST_MAX_WORKERS: 2
  # Turbo Remote Cache. Set TURBO_TOKEN (secret) and TURBO_TEAM (variable) in the
  # repository settings to share the cache across CI runs and contributors.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm verify` runs `beachball check`, which diffs against
          # origin/main, so the full git history must be available.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0 --registry=https://registry.npmjs.org/
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes ngspice
      # Storybook browser tests run through Playwright.
      - run: pnpm --filter blog-writer exec playwright install --with-deps chromium
      - run: pnpm verify
