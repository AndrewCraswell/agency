name: CI

# legislation-staging-deployment.yml deploys after a successful run of this workflow on main, by its name.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect legislation changes
    runs-on: ubuntu-latest
    env:
      # The committed .npmrc supports development behind the work VPN. CI uses
      # pnpm's higher-precedence override and does not need Azure credentials.
      PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    outputs:
      web: ${{ steps.detect.outputs.web }}
      mcp: ${{ steps.detect.outputs.mcp }}
      core: ${{ steps.detect.outputs.core }}
      database: ${{ steps.detect.outputs.database }}
      ingestion: ${{ steps.detect.outputs.ingestion }}
    steps:
      # Detection needs Node and the history it diffs, not the workspace's dependencies.
      - uses: betterapps-hq/pipelines/github/actions/setup@c3b85f070cf22fbf7a4dae841461f82e2b16ea20 # v1.2.0
        with:
          fetch-depth: 0
          install: "false"
      - name: Detect affected legislation surfaces
        id: detect
        env:
          BASE_SHA:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/legislation-change-detection.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  # Its check is "Required verification / Verify (ubuntu-latest)". No branch rule or workflow needs it by name.
  verify:
    name: Required verification
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@c3b85f070cf22fbf7a4dae841461f82e2b16ea20 # v1.2.0
    with:
      # The full history this job has always fetched.
      fetch-depth: 0
      # A called workflow doesn't get this one's env, so its settings go here. The committed .npmrc supports development
      # behind the work VPN: CI uses pnpm's higher-precedence override and does not need Azure credentials. Vitest's
      # workers are capped to keep interaction-heavy browser tests deterministic on hosted runners. Turbo Remote Cache
      # takes TURBO_TOKEN (secret) and TURBO_TEAM (variable) from the repository settings, once they're set there.
      env: |
        PNPM_CONFIG_REGISTRY=https://registry.npmjs.org/
        VITEST_MAX_WORKERS=2
        TURBO_TEAM=${{ vars.TURBO_TEAM }}
      prepare: |
        sudo apt-get update && sudo apt-get install --yes ngspice
        # Storybook browser tests run through Playwright.
        pnpm --filter blog-writer exec playwright install --with-deps chromium
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
