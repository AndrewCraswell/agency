name: CI

# legislation-staging-deployment.yml deploys after a successful run of this workflow on main, by its name.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The committed .npmrc supports development behind the work VPN. CI uses
  # pnpm's higher-precedence override and does not need Azure credentials.
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  # Keep interaction-heavy browser tests deterministic on hosted runners.
  VITEST_MAX_WORKERS: 2
  # Turbo Remote Cache. Set TURBO_TOKEN (secret) and TURBO_TEAM (variable) in the
  # repository settings to share the cache across CI runs and contributors.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: Detect legislation changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      mcp: ${{ steps.detect.outputs.mcp }}
      core: ${{ steps.detect.outputs.core }}
      database: ${{ steps.detect.outputs.database }}
      ingestion: ${{ steps.detect.outputs.ingestion }}
    steps:
      # Detection needs Node and the history it diffs, not the workspace's dependencies.
      - uses: betterapps-hq/pipelines/github/actions/setup@978c87e0f9676edfb85ea5ca735e3cea656c8475 # v1.1.0
        with:
          fetch-depth: 0
          install: "false"
      - name: Detect affected legislation surfaces
        id: detect
        env:
          BASE_SHA:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/legislation-change-detection.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  # This stays here rather than calling the shared ci-verify workflow until that workflow can set PNPM_CONFIG_REGISTRY
  # before its install: a called workflow doesn't get this one's env, and the .npmrc's Azure feed needs credentials.
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@978c87e0f9676edfb85ea5ca735e3cea656c8475 # v1.1.0
        with:
          # The full history this job has always fetched.
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install --yes ngspice
      # Storybook browser tests run through Playwright.
      - run: pnpm --filter blog-writer exec playwright install --with-deps chromium
      - run: pnpm verify
