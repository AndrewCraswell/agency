name: Legislation staging deployment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_web:
        description: Deploy and verify staging legislation-web
        required: true
        default: true
        type: boolean
      deploy_mcp:
        description: Deploy and verify staging legislation-mcp
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: legislation-staging-deployment
  cancel-in-progress: false

env:
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RAILWAY_CALLER: github-actions:legislation-staging-deployment
  RAILWAY_AGENT_SESSION: github-actions-legislation-staging-deployment
  RAILWAY_PROJECT_ID: 2378281c-c1c7-4530-8525-5f313741d19b
  RAILWAY_ENVIRONMENT_ID: cce97dac-1cd4-4ccc-ad9c-bd08b8b13efd
  LEGISLATION_WEB_SERVICE_ID: 786fbca7-8798-4357-9b45-f0ba092a9750
  LEGISLATION_MCP_SERVICE_ID: eb6deb23-26a0-41e7-8aab-f06c4e1f0b8b
  LEGISLATION_WEB_STAGING_URL: https://legislation-web-staging.up.railway.app
  LEGISLATION_MCP_STAGING_URL: https://legislation-mcp-staging.up.railway.app

jobs:
  deploy:
    name: Deploy affected staging services
    if:
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name ==
      'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect affected legislation services
        id: changes
        env:
          DEPLOY_MCP: ${{ inputs.deploy_mcp }}
          DEPLOY_WEB: ${{ inputs.deploy_web }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "web=${DEPLOY_WEB}" >> "$GITHUB_OUTPUT"
            echo "mcp=${DEPLOY_MCP}" >> "$GITHUB_OUTPUT"
            echo "database=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          node scripts/legislation-change-detection.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Reject unowned staging database changes
        if: steps.changes.outputs.database == 'true'
        run: |
          echo "::error::This commit changes the legislation database contract. Run the protected staging migration workflow before deploying applications."
          exit 1

      - name: Verify staging deployment credentials
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.mcp == 'true'
        env:
          LEGISLATION_SMOKE_BILL_ID: ${{ vars.LEGISLATION_SMOKE_BILL_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SENTRY_MCP_PROJECT_SLUG: ${{ vars.SENTRY_MCP_PROJECT_SLUG }}
          SENTRY_ORGANIZATION_SLUG: ${{ vars.SENTRY_ORGANIZATION_SLUG }}
          SENTRY_STAGING_AUTH_TOKEN: ${{ secrets.SENTRY_STAGING_AUTH_TOKEN }}
          WORKOS_API_SMOKE_CLIENT_ID: ${{ secrets.WORKOS_API_SMOKE_CLIENT_ID }}
          WORKOS_API_SMOKE_CLIENT_SECRET: ${{ secrets.WORKOS_API_SMOKE_CLIENT_SECRET }}
          WORKOS_API_SMOKE_ISSUER: ${{ vars.WORKOS_API_SMOKE_ISSUER }}
          WORKOS_MCP_SMOKE_CLIENT_ID: ${{ secrets.WORKOS_MCP_SMOKE_CLIENT_ID }}
          WORKOS_MCP_SMOKE_CLIENT_SECRET: ${{ secrets.WORKOS_MCP_SMOKE_CLIENT_SECRET }}
        run: |
          missing=0
          require_secret() {
            if [ -z "$2" ]; then
              echo "::error::The protected staging environment requires the $1 secret."
              missing=1
            fi
          }
          require_secret RAILWAY_TOKEN "$RAILWAY_TOKEN"
          if [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            require_secret WORKOS_API_SMOKE_CLIENT_ID "$WORKOS_API_SMOKE_CLIENT_ID"
            require_secret WORKOS_API_SMOKE_CLIENT_SECRET "$WORKOS_API_SMOKE_CLIENT_SECRET"
            if [ -z "$WORKOS_API_SMOKE_ISSUER" ]; then
              echo "::error::The protected staging environment requires the WORKOS_API_SMOKE_ISSUER variable."
              missing=1
            fi
          fi
          if [ "${{ steps.changes.outputs.mcp }}" = "true" ]; then
            require_secret WORKOS_MCP_SMOKE_CLIENT_ID "$WORKOS_MCP_SMOKE_CLIENT_ID"
            require_secret WORKOS_MCP_SMOKE_CLIENT_SECRET "$WORKOS_MCP_SMOKE_CLIENT_SECRET"
            require_secret SENTRY_STAGING_AUTH_TOKEN "$SENTRY_STAGING_AUTH_TOKEN"
            if [ -z "$LEGISLATION_SMOKE_BILL_ID" ]; then
              echo "::error::The protected staging environment requires the LEGISLATION_SMOKE_BILL_ID variable."
              missing=1
            fi
            for variable in SENTRY_ORGANIZATION_SLUG SENTRY_MCP_PROJECT_SLUG; do
              if [ -z "${!variable}" ]; then
                echo "::error::The protected staging environment requires the ${variable} variable."
                missing=1
              fi
            done
          fi
          exit "$missing"

      - name: Install Railway CLI
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.mcp == 'true'
        run: npm install --global @railway/cli@5.54.1 --registry=https://registry.npmjs.org/

      - name: Verify staging legislation-web telemetry configuration
        if: steps.changes.outputs.web == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$LEGISLATION_WEB_SERVICE_ID" \
            --json |
            node apps/legislation-mcp/scripts/verify-staging-variables.mjs web

      - name: Deploy staging legislation-web
        id: web-deployment
        if: steps.changes.outputs.web == 'true'
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          DEPLOYMENT_ID="$(
            railway api \
              'mutation Deploy($environmentId: String!, $serviceId: String!, $commitSha: String!) {
                serviceInstanceDeployV2(
                  environmentId: $environmentId
                  serviceId: $serviceId
                  commitSha: $commitSha
                )
              }' \
              --raw-var environmentId="$RAILWAY_ENVIRONMENT_ID" \
              --raw-var serviceId="$LEGISLATION_WEB_SERVICE_ID" \
              --raw-var commitSha="$DEPLOY_SHA" |
              jq --exit-status --raw-output '.data.serviceInstanceDeployV2'
          )"
          for attempt in {1..90}; do
            STATUS="$(
              railway deployment list \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --service "$LEGISLATION_WEB_SERVICE_ID" \
                --json |
                jq --raw-output --arg id "$DEPLOYMENT_ID" '.[] | select(.id == $id) | .status'
            )"
            case "$STATUS" in
              SUCCESS)
                echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED | CRASHED | NEEDS_APPROVAL | SLEEPING | SKIPPED | REMOVED | REMOVING)
                echo "::error::Staging W deployment ${DEPLOYMENT_ID} reached ${STATUS}."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for staging W deployment ${DEPLOYMENT_ID}."
          exit 1

      - name: Verify staging legislation-web
        if: steps.changes.outputs.web == 'true'
        env:
          LEGISLATION_API_SMOKE_BASE_URL: ${{ env.LEGISLATION_WEB_STAGING_URL }}
          LEGISLATION_BROWSER_SMOKE_BASE_URL: ${{ env.LEGISLATION_WEB_STAGING_URL }}
          LEGISLATION_CDN_SMOKE_BASE_URL: ${{ env.LEGISLATION_WEB_STAGING_URL }}
          LEGISLATION_DEPLOYMENT_COMMIT_SHA:
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          LEGISLATION_READINESS_BASE_URL: ${{ env.LEGISLATION_WEB_STAGING_URL }}
          WORKOS_API_SMOKE_CLIENT_ID: ${{ secrets.WORKOS_API_SMOKE_CLIENT_ID }}
          WORKOS_API_SMOKE_CLIENT_SECRET: ${{ secrets.WORKOS_API_SMOKE_CLIENT_SECRET }}
          WORKOS_API_SMOKE_ISSUER: ${{ vars.WORKOS_API_SMOKE_ISSUER }}
        run: |
          node apps/legislation-web/scripts/wait-readiness.mjs
          node apps/legislation-web/scripts/smoke-deployment.mjs
          node apps/legislation-web/scripts/smoke-cdn.mjs

      - name: Install staging smoke dependencies
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.mcp == 'true'
        run: |
          npm install --global pnpm@11.9.0 --registry=https://registry.npmjs.org/
          pnpm install --frozen-lockfile

      - name: Install staging browser
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter legislation-web exec playwright install --with-deps chromium

      - name: Verify staging legislation-web in a browser
        if: steps.changes.outputs.web == 'true'
        env:
          LEGISLATION_BROWSER_SMOKE_BASE_URL: ${{ env.LEGISLATION_WEB_STAGING_URL }}
        run: pnpm --filter legislation-web smoke:browser

      - name: Verify staging legislation-mcp routing and telemetry configuration
        if: steps.changes.outputs.mcp == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$LEGISLATION_MCP_SERVICE_ID" \
            --json |
            node apps/legislation-mcp/scripts/verify-staging-variables.mjs mcp

      - name: Deploy staging legislation-mcp
        id: mcp-deployment
        if: steps.changes.outputs.mcp == 'true'
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          DEPLOYMENT_ID="$(
            railway api \
              'mutation Deploy($environmentId: String!, $serviceId: String!, $commitSha: String!) {
                serviceInstanceDeployV2(
                  environmentId: $environmentId
                  serviceId: $serviceId
                  commitSha: $commitSha
                )
              }' \
              --raw-var environmentId="$RAILWAY_ENVIRONMENT_ID" \
              --raw-var serviceId="$LEGISLATION_MCP_SERVICE_ID" \
              --raw-var commitSha="$DEPLOY_SHA" |
              jq --exit-status --raw-output '.data.serviceInstanceDeployV2'
          )"
          for attempt in {1..90}; do
            STATUS="$(
              railway deployment list \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --service "$LEGISLATION_MCP_SERVICE_ID" \
                --json |
                jq --raw-output --arg id "$DEPLOYMENT_ID" '.[] | select(.id == $id) | .status'
            )"
            case "$STATUS" in
              SUCCESS)
                echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED | CRASHED | NEEDS_APPROVAL | SLEEPING | SKIPPED | REMOVED | REMOVING)
                echo "::error::Staging M deployment ${DEPLOYMENT_ID} reached ${STATUS}."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for staging M deployment ${DEPLOYMENT_ID}."
          exit 1

      - name: Verify staging legislation-mcp
        if: steps.changes.outputs.mcp == 'true'
        env:
          LEGISLATION_DEPLOYMENT_COMMIT_SHA:
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          LEGISLATION_MCP_SMOKE_BASE_URL: ${{ env.LEGISLATION_MCP_STAGING_URL }}
          LEGISLATION_READINESS_BASE_URL: ${{ env.LEGISLATION_MCP_STAGING_URL }}
          LEGISLATION_SENTRY_CANARY: "true"
          LEGISLATION_SENTRY_CANARY_MARKER: "legislation-staging-${{ github.run_id }}-${{ github.run_attempt }}"
          LEGISLATION_SENTRY_ENVIRONMENT: staging
          LEGISLATION_SMOKE_BILL_ID: ${{ vars.LEGISLATION_SMOKE_BILL_ID }}
          RAILWAY_DEPLOYMENT_ID: ${{ steps.mcp-deployment.outputs.deployment_id }}
          WORKOS_MCP_SMOKE_CLIENT_ID: ${{ secrets.WORKOS_MCP_SMOKE_CLIENT_ID }}
          WORKOS_MCP_SMOKE_CLIENT_SECRET: ${{ secrets.WORKOS_MCP_SMOKE_CLIENT_SECRET }}
        run: |
          node apps/legislation-web/scripts/wait-readiness.mjs
          pnpm --filter legislation-mcp smoke:deployment

      - name: Verify controlled staging Sentry canary
        if: steps.changes.outputs.mcp == 'true'
        env:
          LEGISLATION_SENTRY_CANARY_MARKER: "legislation-staging-${{ github.run_id }}-${{ github.run_attempt }}"
          SENTRY_MCP_PROJECT_SLUG: ${{ vars.SENTRY_MCP_PROJECT_SLUG }}
          SENTRY_ORGANIZATION_SLUG: ${{ vars.SENTRY_ORGANIZATION_SLUG }}
          SENTRY_STAGING_AUTH_TOKEN: ${{ secrets.SENTRY_STAGING_AUTH_TOKEN }}
        run: pnpm --filter legislation-mcp verify:sentry-canary
